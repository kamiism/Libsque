services:
  - type: web
    name: libsque
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SOCIAL_STORAGE_ENGINE
        value: tablesdb
      - key: VITE_APPWRITE_ENDPOINT
        value: https://cloud.appwrite.io/v1
      - key: VITE_APPWRITE_PROJECT_ID
        sync: false
      - key: VITE_APPWRITE_DATABASE_ID
        sync: false
      - key: VITE_APPWRITE_PROFILES_COLLECTION_ID
        sync: false
      - key: VITE_APPWRITE_LIBRARY_COLLECTION_ID
        sync: false
      - key: VITE_GOOGLE_BOOKS_API_KEY
        sync: false
      - key: APPWRITE_API_KEY
        sync: false
      - key: DOAB_ADMIN_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: BETA_ALLOWED_USERS
        sync: false

